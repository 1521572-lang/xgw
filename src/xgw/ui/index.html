<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>XGW</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/icon.svg" alt="" width="30" height="30">
    <span class="brand-name">XGW</span>
    <span class="brand-note" id="brand-note">шлюз</span>
  </div>
  <div id="chip" class="chip" data-tone="off">Загрузка…</div>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main class="grid">
  <div class="col side">
    <section class="card hero" id="hero" data-tone="off" aria-labelledby="power-title">
      <button id="power" class="power" type="button" aria-pressed="false"
              aria-describedby="power-sub" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5v8.5"/>
          <path d="M6.6 7.2a7.6 7.6 0 1 0 10.8 0"/>
        </svg>
        <span class="visually-hidden" id="power-label">Включить VPN</span>
      </button>
      <h1 id="power-title">Загрузка…</h1>
      <p id="power-sub" class="muted"></p>
      <p id="power-why" class="why" hidden></p>
      <div id="current" class="current" hidden>
        <div class="current-text">
          <span id="current-label" class="muted small"></span>
          <span id="current-name" class="current-name"></span>
        </div>
        <button id="unpin" class="btn small-btn" type="button" title="Сервер снова выбирает шлюз" hidden>Автовыбор</button>
      </div>
    </section>

    <section class="card subs-card" aria-labelledby="subs-title">
      <div class="card-head">
        <h2 id="subs-title">Подписки</h2>
        <button id="refresh" class="btn ghost" type="button">Обновить</button>
      </div>
      <form id="add" class="add" autocomplete="off">
        <label class="visually-hidden" for="add-text">Адрес подписки или ссылка сервера</label>
        <textarea id="add-text" rows="2" spellcheck="false"
                  placeholder="Вставьте адрес подписки (https://…) или ссылку сервера (vless://…)"></textarea>
        <div class="add-actions">
          <button id="paste" class="btn ghost" type="button" hidden>Вставить из буфера</button>
          <button id="add-submit" class="btn primary" type="submit">Добавить</button>
        </div>
      </form>
      <ul id="subs" class="list"></ul>
      <ul id="links" class="list"></ul>
    </section>

    <section class="card tg-card" id="tg-card" aria-labelledby="tg-title">
      <div class="card-head">
        <h2 id="tg-title">Telegram</h2>
        <span id="tg-chip" class="tag" hidden></span>
      </div>
      <p id="tg-text" class="muted small"></p>
      <p id="tg-error" class="why" hidden></p>
      <form id="tg-form" class="add" autocomplete="off" hidden>
        <label class="visually-hidden" for="tg-token">Токен бота</label>
        <input id="tg-token" type="password" spellcheck="false" autocomplete="off"
               placeholder="Токен бота от @BotFather">
        <div class="add-actions">
          <button id="tg-submit" class="btn primary" type="submit">Подключить</button>
        </div>
      </form>
      <div id="tg-pair" class="pair" hidden>
        <p id="tg-pair-text" class="small"></p>
        <code id="tg-cmd" class="pair-code"></code>
        <p id="tg-until" class="muted small"></p>
        <div class="add-actions">
          <button id="tg-newcode" class="btn ghost" type="button">Новый код</button>
        </div>
      </div>
      <div id="tg-actions" class="add-actions" hidden>
        <button id="tg-off" class="btn ghost" type="button">Отключить бота</button>
      </div>
    </section>
  </div>

  <div class="col main">
    <section class="card servers-card" aria-labelledby="servers-title">
      <div class="card-head">
        <h2 id="servers-title">Серверы <span id="members-count" class="count"></span></h2>
        <button id="scan" class="btn ghost" type="button">Проверить запасные</button>
      </div>
      <div id="main-box" class="main-box" hidden>
        <button id="sticky" class="switch" type="button" role="switch" aria-checked="false"
                aria-labelledby="sticky-title" aria-describedby="main-note"></button>
        <div class="main-text">
          <span id="sticky-title" class="main-title">Один основной сервер</span>
          <span id="main-note" class="muted small"></span>
        </div>
        <button id="speed" class="btn ghost" type="button">Замерить скорость</button>
      </div>
      <p id="nodes-note" class="muted small nodes-note" hidden></p>
      <p id="tier-note" class="muted small" hidden></p>
      <p id="reserve-note" class="note" role="status" hidden></p>
      <p id="probe-note" class="note bad" role="alert" hidden></p>
      <p id="pin-note" class="note" hidden></p>
      <div id="groups"></div>
      <p id="servers-empty" class="muted empty-text" hidden></p>
      <p id="budget-note" class="budget-note muted small" hidden></p>
      <details id="removed-box" class="group removed" hidden>
        <summary><span class="group-name">Убранные</span>
          <span id="removed-count" class="group-count muted small"></span></summary>
        <ul id="removed" class="list servers"></ul>
      </details>
    </section>

    <section class="card devices-card" id="devices-card" aria-labelledby="devices-title" hidden>
      <div class="card-head">
        <h2 id="devices-title">Устройства <span id="devices-count" class="count"></span></h2>
        <span id="devices-note" class="muted small"></span>
      </div>
      <ul id="devices" class="list"></ul>
    </section>

    <section class="card events-card" aria-labelledby="events-title">
      <div class="card-head">
        <h2 id="events-title">События</h2>
      </div>
      <ul id="events" class="list events"></ul>
    </section>
  </div>
</main>

<footer class="foot muted small" id="foot"></footer>

<dialog id="edit-sub-dialog" class="dialog" aria-labelledby="edit-sub-title">
  <form method="dialog" id="edit-sub-form">
    <h3 id="edit-sub-title"></h3>
    <div id="edit-sub-body"></div>
    <div class="dialog-actions">
      <button class="btn ghost" value="cancel">Отмена</button>
      <button id="edit-sub-save" class="btn primary" value="save">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text" class="muted"></p>
    <div class="dialog-actions">
      <button class="btn ghost" value="cancel">Отмена</button>
      <button id="confirm-yes" class="btn danger" value="yes">Убрать</button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
