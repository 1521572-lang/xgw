# Shared systemd settings for the standalone, read-only panel process.
# Keep its IPC socket outside the masked runtime directories.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
InaccessiblePaths=/etc/xgw /var/lib/xgw /run/xgw -/run/xgw-xray -/run/xgw-singbox
RestrictAddressFamilies=AF_INET AF_UNIX
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
UMask=0077
