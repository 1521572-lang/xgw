[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgw"
version = "0.1.8"
description = "XGW — шлюз Ubuntu 26.04 на Xray-core с автопереключением VPN-серверов (GET-проверка «заморозки»)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xgw = "xgw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xgw = ["py.typed", "ui/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001–RUF003 (ambiguous unicode) отключены: сообщения и докстринги намеренно на русском;
# SIM905 — список стран ISO компактнее строкой с .split()
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Фейковые ссылки-константы не переносятся по строкам
"tests/links.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
